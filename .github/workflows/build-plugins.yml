name: Build VST3 & AU Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Universal (VST3 + AU)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHALDEN_BUILD_TESTS=ON

      - name: Run DSP tests
        run: |
          cmake --build build --config Release --target HaldenTests -j 4
          ./build/HaldenTests_artefacts/Release/HaldenTests

      - name: Build VST3 and Audio Unit (.component)
        run: cmake --build build --config Release --target HaldenReverb369_VST3 HaldenReverb369_AU -j 4

      - name: Sign (ad-hoc) and package macOS plugins
        run: |
          OUT=build/HaldenReverb369_artefacts/Release
          mkdir -p dist-macos
          cp -R "$OUT/VST3/Halden Reverb 369.vst3" dist-macos/
          cp -R "$OUT/AU/Halden Reverb 369.component" dist-macos/
          codesign --force --deep --sign - "dist-macos/Halden Reverb 369.vst3"
          codesign --force --deep --sign - "dist-macos/Halden Reverb 369.component"
          cd dist-macos
          ditto -c -k --keepParent "Halden Reverb 369.vst3" "Halden-Reverb-369-macOS-VST3.zip"
          ditto -c -k --keepParent "Halden Reverb 369.component" "Halden-Reverb-369-macOS-AU.zip"
          ls -la

      - name: Upload macOS VST3 & AU
        uses: actions/upload-artifact@v4
        with:
          name: HaldenReverb369-macOS-VST3-AU
          path: dist-macos/*.zip

  build-windows:
    name: Windows x64 (VST3)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target HaldenReverb369_VST3

      - name: Collect Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | ForEach-Object {
            Copy-Item -Recurse -Force -Path $_.FullName -Destination "dist-windows/"
          }
          Get-ChildItem dist-windows

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: HaldenReverb369-Windows-VST3
          path: dist-windows/
